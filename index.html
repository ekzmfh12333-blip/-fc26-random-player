<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FC26 Random Player Lab</title>
<style>
:root{--bg:#070b13;--panel:#101827;--line:#2b3c55;--text:#f5f7fb;--muted:#9eacc2;--green:#63f2b5;--blue:#74a7ff;--gold:#ffd36a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#263d61,#0b111d 45%,#070b13 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 14px 50px}.brand{font-weight:900;font-size:21px;margin-bottom:18px}.brand span{color:var(--green)}h1{font-size:clamp(29px,7vw,46px);line-height:1.08;letter-spacing:-1.5px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 18px}.panel{background:linear-gradient(145deg,#121d2e,#0d1522);border:1px solid var(--line);border-radius:20px;padding:17px;margin-top:14px;box-shadow:0 14px 35px #0004}.panel h2{font-size:16px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#0a111d;color:var(--text)}.range{display:flex;align-items:center;gap:12px}.range input{width:100%}.range output{min-width:36px;text-align:center;color:var(--green);font-weight:900}.controls{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#233149;color:var(--text);font-weight:800}.primary{background:linear-gradient(100deg,#4ce8a8,#7fa9ff);color:#07101a;border:0}.wide{width:100%;margin-top:15px}.category{margin-top:18px;border:1px solid var(--line);border-radius:17px;overflow:hidden}.cathead{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;background:#172338}.cathead h3{margin:0;font-size:17px}.cathead span{font-size:11px;color:var(--muted)}.statrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid #ffffff12}.statname{flex:1;font-size:13px;font-weight:750}.statvalue{width:39px;text-align:center;font-weight:950;color:var(--green)}.bar{width:85px;height:6px;background:#29384c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#54dca8,#7fa9ff)}.draw{padding:8px 9px;border:1px solid #46617e;border-radius:9px;background:#0a1422;color:#fff;font-size:11px;font-weight:900}.draw:disabled{opacity:.45}.rolling{animation:pulse .1s infinite alternate}@keyframes pulse{to{filter:brightness(1.6);transform:translateY(-1px)}}.summary{display:none}.summary.show{display:block}.card{border:1px solid #6d91b7;border-radius:22px;padding:18px;background:linear-gradient(145deg,#1b3552,#0e1728)}.topline{display:flex;justify-content:space-between}.ovr{font-size:62px;font-weight:1000;line-height:1}.pos{color:var(--green);font-weight:900;margin-top:6px}.name{font-size:27px;font-weight:950;margin-top:20px}.meta{font-size:12px;color:#b7c7dc;margin-top:6px}.tiny{font-size:11px;line-height:1.6;color:var(--muted);margin-top:10px}@media(max-width:480px){.grid{grid-template-columns:1fr}.bar{width:55px}.statname{font-size:12px}.draw{padding:8px 7px}}
</style></head>
<body><div class="wrap">
<div class="brand">FC26 <span>PLAYER LAB</span></div>
<h1>나만의 생성선수<br>랜덤 스튜디오</h1>
<p class="sub">FC26 실제 메뉴 순서에 맞춰 능력치를 하나씩 추첨하세요.</p>
<section class="panel"><h2>01 · 선수 기본 설정</h2><div class="grid">
<div class="field"><label>선수 이름</label><input id="name" placeholder="예: 이기찬"></div>
<div class="field"><label>포지션</label><select id="position"><option>ST</option><option>CF</option><option>LW</option><option>RW</option><option>CAM</option><option>CM</option><option>CDM</option><option>LB</option><option>RB</option><option>CB</option><option>GK</option></select></div>
<div class="field"><label>국적</label><input id="nation" placeholder="대한민국"></div><div class="field"><label>나이</label><input id="age" type="number" value="18"></div><div class="field"><label>키(cm)</label><input id="height" type="number" value="180"></div><div class="field"><label>몸무게(kg)</label><input id="weight" type="number" value="75"></div>
</div></section>
<section class="panel"><h2>02 · 추첨 범위</h2><div class="field"><label>일반 능력치 최소값</label><div class="range"><input id="min" type="range" min="1" max="80" value="30" oninput="minOut.value=this.value"><output id="minOut">30</output></div></div><div class="field" style="margin-top:13px"><label>일반 능력치 최대값</label><div class="range"><input id="max" type="range" min="50" max="99" value="99" oninput="maxOut.value=this.value"><output id="maxOut">99</output></div></div><div class="controls" style="margin-top:15px"><button class="btn primary" onclick="drawAll()">🎰 아직 안 뽑은 능력치 전체 추첨</button><button class="btn" onclick="resetStats()">↺ 능력치 초기화</button></div><div class="tiny">각 능력치 오른쪽의 ‘추첨’ 버튼을 누르면 해당 수치만 슬롯처럼 돌아갑니다. 약한 발 능력은 1~5로 추첨됩니다.</div></section>
<section class="panel"><h2>03 · 능력치 추첨</h2><div id="categories"></div></section>
<section class="panel summary" id="summary"><div class="card"><div class="topline"><div><div class="ovr" id="ovr">--</div><div class="pos" id="posOut">ST</div></div><span class="tiny">FC26 · GENERATED</span></div><div class="name" id="nameOut">GENERATED PLAYER</div><div class="meta" id="metaOut"></div><div class="tiny" style="margin-top:18px">현재 추첨된 능력치 기준 예상 OVR</div></div></section>
</div>
<script>
const categories=[
 ['운동 능력',[['Acceleration','가속력'],['SprintSpeed','속력'],['Agility','민첩성'],['Reactions','반응 속도'],['Balance','밸런스']]],
 ['머리',[['Aggression','적극성'],['Interceptions','가로채기'],['Positioning','포지셔닝'],['Vision','시야'],['Penalties','페널티킥']]],
 ['키트',[['ShotPower','슛 파워'],['Jumping','점프'],['Stamina','스태미나'],['Strength','힘'],['LongShots','중거리 슛']]],
 ['공격',[['Crossing','크로스'],['Finishing','골 결정력'],['HeadingAccuracy','헤딩 정확도'],['ShortPassing','짧은 패스'],['Volleys','발리슛'],['WeakFoot','약한 발 능력']]],
 ['스킬',[['Dribbling','드리블'],['Curve','커브'],['FKAccuracy','프리킥 정확도'],['LongPassing','긴 패스'],['BallControl','볼 컨트롤']]],
 ['수비',[['StandingTackle','스탠딩 태클'],['SlidingTackle','슬라이딩 태클']]],
 ['골키퍼',[['GKDiving','GK 다이빙'],['GKHandling','GK 핸들링'],['GKKicking','GK 골 킥'],['GKPositioning','GK 포지셔닝'],['GKReflexes','GK 반응 속도']]]
];
const stats={};let timers={};
function rangeFor(k){return k==='WeakFoot'?[1,5]:[+min.value,+max.value]}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function build(){categoriesEl.innerHTML=categories.map(([cat,arr])=>`<div class="category"><div class="cathead"><h3>${cat}</h3><span>${arr.length}개 능력치</span></div>${arr.map(([k,label])=>`<div class="statrow"><div class="statname">${label}</div><div class="statvalue" id="v-${k}">--</div><div class="bar"><i id="b-${k}" style="width:0%"></i></div><button class="draw" id="d-${k}" onclick="drawOne('${k}')">추첨</button></div>`).join('')}</div>`).join('')}
function drawOne(k){let [a,b]=rangeFor(k);if(a>b){alert('최소값이 최대값보다 큽니다.');return}const btn=document.getElementById('d-'+k);btn.disabled=true;let n=0;clearInterval(timers[k]);timers[k]=setInterval(()=>{n++;const v=rand(a,b);setValue(k,v,true);if(n>=16){clearInterval(timers[k]);stats[k]=v;setValue(k,v,false);btn.disabled=false;updateSummary()}},75)}
function setValue(k,v,rolling){const el=document.getElementById('v-'+k);el.textContent=v;el.classList.toggle('rolling',rolling);document.getElementById('b-'+k).style.width=(k==='WeakFoot'?v*20:v)+'%'}
function drawAll(){categories.flatMap(x=>x[1]).forEach(([k])=>{if(stats[k]===undefined)drawOne(k)})}
function resetStats(){Object.keys(timers).forEach(k=>clearInterval(timers[k]));Object.keys(stats).forEach(k=>delete stats[k]);categories.flatMap(x=>x[1]).forEach(([k])=>{setValue(k,'--',false);document.getElementById('d-'+k).disabled=false});updateSummary()}
function updateSummary(){const vals=Object.values(stats);let avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):'--';summary.classList.add('show');ovr.textContent=avg;posOut.textContent=position.value;nameOut.textContent=(name.value.trim()||'GENERATED PLAYER').toUpperCase();metaOut.textContent=`${nation.value.trim()||'Free Agent'} · ${age.value||18}세 · ${height.value||180}cm · ${weight.value||75}kg · ${vals.length}/33개 추첨 완료`}
const categoriesEl=document.getElementById('categories');const summary=document.getElementById('summary');const ovr=document.getElementById('ovr');const posOut=document.getElementById('posOut');const nameOut=document.getElementById('nameOut');const metaOut=document.getElementById('metaOut');const name=document.getElementById('name');const nation=document.getElementById('nation');const age=document.getElementById('age');const height=document.getElementById('height');const weight=document.getElementById('weight');const min=document.getElementById('min');const max=document.getElementById('max');const position=document.getElementById('position');
build();updateSummary();
</script></body></html>
